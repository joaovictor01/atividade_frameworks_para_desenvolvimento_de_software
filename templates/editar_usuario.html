<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"> 
    <link href="../static/bootstrap.css" rel="stylesheet" />
    <title>Comprar e vender - Edicao de {{titulo}}</title>
</head>

<body>
    <div class="container">
        <h4>Edicao de {{titulo}}</h4>
        <form action="/usuario/editar/{{ usuario.id }}" method="post">
            <div class="form-group">
                <label for="user">Username</label>
                <input class="form-control" type="text" id="username" name="username" value="{{usuario.nome}}">
            </div>
    
            <div class="form-group">
                <label for="email">E-mail</label>
                <input class="form-control" type="text" id="email" name="email" value="{{usuario.email}}">
            </div>
    
            <div class="form-group">
                <label for="passwd">Password</label>
                <input class="form-control" type="text" id="password" name="password" value="{{usuario.senha}}">
            </div>
    
            <div class="form-group">
                <label for="end">Endereco</label>
                <input class="form-control" type="text" id="address" name="address" value="{{usuario.endereco}}">
            </div>
            
            <button class="btn btn-success" type="submit" value="Alterar">Alterar</button>
        </form>
        <a href={{url_for("usuario")}}> Cancelar</a>
    </div>
    
    <!-- Bootstrap 5 JavaScript -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
</body>

</html>
