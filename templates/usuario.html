<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"> 
    <link href="../static/bootstrap.css" rel="stylesheet" />
    <title>Comprar e vender - Cadastro de {{titulo}}</title>
</head>

<body>
    <div class="container">
        <h4>Cadastro de {{titulo}}</h4>
        <form action="/usuario/criar" method="post">
            <div class="form-group">
                <label for="user">Username</label>
                <input class="form-control" type="text" id="username" name="username">
            </div>
    
            <div class="form-group">
                <label for="email">E-mail</label>
                <input class="form-control" type="text" id="email" name="email">
            </div>
    
            <div class="form-group">
                <label for="passwd">Password</label>
                <input class="form-control" type="text" id="password" name="password">
            </div>
    
            <div class="form-group">
                <label for="end">Endereco</label>
                <input class="form-control" type="text" id="address" name="address">
            </div>
            
            <button class="btn btn-success" type="submit" value="Cadastrar">Cadastrar</button>
        </form>
    
        <h4>Lista de {{titulo}}</h4>
        <table class="table">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Senha</th>
                    <th>Endereco</th>
                    <th>Editar</th>
                    <th>Deletar</th>
                </tr>
            </thead>
            <tbody>
                {% for usuario in usuarios %}
                    <tr>
                        <td>{{ usuario.nome }}</td>
                        <td>{{ usuario.email }}</td>
                        <td>{{ usuario.senha }}</td>
                        <td>{{ usuario.endereco }}</td>
                        <td><a href={{ url_for("editarusuario",id=usuario.id) }}>Editar?</a></td>
                        <td><a href={{ url_for("deletarusuario",id=usuario.id) }}>Deletar?</a></td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    
    <!-- Bootstrap 5 JavaScript -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
</body>

</html>
